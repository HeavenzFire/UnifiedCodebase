name: Worker Dispatch Contract

on:
  pull_request:
    paths:
      - "integrations/worker-dispatcher.mjs"
      - "integrations/worker-dispatcher.test.mjs"
      - "integrations/worker-result-journal.mjs"
      - "integrations/registry-worker-adapter.mjs"
      - "integrations/registry-worker-adapter.test.mjs"
      - "integrations/worker-host.mjs"
      - "integrations/worker-host.test.mjs"
      - "integrations/default-worker-host.mjs"
      - "integrations/default-worker-host.test.mjs"
      - "integrations/worker-host-cli.mjs"
      - "integrations/worker-host-cli.test.mjs"
      - "Invoke-UnifiedFieldTask.ps1"
      - "Enter-UnifiedField.ps1"
      - "extensions/guardian-evidence/evidence-ledger.mjs"
      - "extensions/funding-integrity/reconcile.mjs"
      - "extensions/local-model/manifest.json"
      - "extensions/local-model/local-model-worker.mjs"
      - "extensions/local-model/local-model-worker.test.mjs"
      - "extensions/sovereign-node-health/manifest.json"
      - "extensions/sovereign-node-health/health-worker.mjs"
      - "extensions/sovereign-node-health/health-worker.test.mjs"
      - "extensions/repository-inventory/manifest.json"
      - "extensions/repository-inventory/inventory-worker.mjs"
      - "extensions/repository-inventory/inventory-worker.test.mjs"
      - "extensions/shared-task-proposal/manifest.json"
      - "extensions/shared-task-proposal/proposal-worker.mjs"
      - "extensions/shared-task-proposal/proposal-worker.test.mjs"
      - "extensions/github-metadata/manifest.json"
      - "extensions/github-metadata/github-metadata-worker.mjs"
      - "extensions/github-metadata/github-metadata-worker.test.mjs"
      - "integrations/shared-task-proposal-adapter.mjs"
      - "integrations/shared-task-proposal-adapter.test.mjs"
      - "integrations/shared-task-inbox.mjs"
      - "integrations/shared-task-inbox.test.mjs"
      - "docs/repository-inventory.snapshot.json"
      - "integrations/validate-repository-inventory.mjs"
      - "integrations/sovereign-node-adapter.mjs"
      - "integrations/extension-registry.mjs"
      - "integrations/governed-task-lifecycle.mjs"
      - "integrations/durable-task-lifecycle.mjs"
      - "integrations/task-lifecycle.mjs"
      - ".github/workflows/worker-dispatch.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "integration/**"
      - "worker/**"
    paths:
      - "integrations/worker-dispatcher.mjs"
      - "integrations/worker-dispatcher.test.mjs"
      - "integrations/worker-result-journal.mjs"
      - "integrations/registry-worker-adapter.mjs"
      - "integrations/registry-worker-adapter.test.mjs"
      - "integrations/worker-host.mjs"
      - "integrations/worker-host.test.mjs"
      - "integrations/default-worker-host.mjs"
      - "integrations/default-worker-host.test.mjs"
      - "integrations/worker-host-cli.mjs"
      - "integrations/worker-host-cli.test.mjs"
      - "Invoke-UnifiedFieldTask.ps1"
      - "Enter-UnifiedField.ps1"
      - "extensions/guardian-evidence/evidence-ledger.mjs"
      - "extensions/funding-integrity/reconcile.mjs"
      - "extensions/local-model/manifest.json"
      - "extensions/local-model/local-model-worker.mjs"
      - "extensions/local-model/local-model-worker.test.mjs"
      - "extensions/sovereign-node-health/manifest.json"
      - "extensions/sovereign-node-health/health-worker.mjs"
      - "extensions/sovereign-node-health/health-worker.test.mjs"
      - "extensions/repository-inventory/manifest.json"
      - "extensions/repository-inventory/inventory-worker.mjs"
      - "extensions/repository-inventory/inventory-worker.test.mjs"
      - "extensions/shared-task-proposal/manifest.json"
      - "extensions/shared-task-proposal/proposal-worker.mjs"
      - "extensions/shared-task-proposal/proposal-worker.test.mjs"
      - "extensions/github-metadata/manifest.json"
      - "extensions/github-metadata/github-metadata-worker.mjs"
      - "extensions/github-metadata/github-metadata-worker.test.mjs"
      - "integrations/shared-task-proposal-adapter.mjs"
      - "integrations/shared-task-proposal-adapter.test.mjs"
      - "integrations/shared-task-inbox.mjs"
      - "integrations/shared-task-inbox.test.mjs"
      - "docs/repository-inventory.snapshot.json"
      - "integrations/validate-repository-inventory.mjs"
      - "integrations/sovereign-node-adapter.mjs"
      - "integrations/extension-registry.mjs"
      - "integrations/governed-task-lifecycle.mjs"
      - "integrations/durable-task-lifecycle.mjs"
      - "integrations/task-lifecycle.mjs"
      - ".github/workflows/worker-dispatch.yml"

permissions:
  contents: read

jobs:
  worker-dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check dispatcher and tests
        run: |
          node --check integrations/worker-dispatcher.mjs
          node --check integrations/worker-result-journal.mjs
          node --check integrations/registry-worker-adapter.mjs
          node --check integrations/registry-worker-adapter.test.mjs
          node --check integrations/worker-host.mjs
          node --check integrations/worker-host.test.mjs
          node --check integrations/default-worker-host.mjs
          node --check integrations/default-worker-host.test.mjs
          node --check extensions/local-model/local-model-worker.mjs
          node --check extensions/local-model/local-model-worker.test.mjs
          node --check extensions/sovereign-node-health/health-worker.mjs
          node --check extensions/sovereign-node-health/health-worker.test.mjs
          node --check extensions/repository-inventory/inventory-worker.mjs
          node --check extensions/repository-inventory/inventory-worker.test.mjs
          node --check extensions/shared-task-proposal/proposal-worker.mjs
          node --check extensions/shared-task-proposal/proposal-worker.test.mjs
          node --check extensions/github-metadata/github-metadata-worker.mjs
          node --check extensions/github-metadata/github-metadata-worker.test.mjs
          node --check integrations/worker-host-cli.mjs
          node --check integrations/worker-host-cli.test.mjs
          node --check integrations/shared-task-inbox.mjs
          node --check integrations/shared-task-inbox.test.mjs
          node --check integrations/worker-dispatcher.test.mjs
      - name: Run governed lifecycle and worker dispatch tests
        run: |
          node --test integrations/task-lifecycle.test.mjs integrations/durable-task-lifecycle.test.mjs integrations/governed-task-lifecycle.test.mjs integrations/worker-dispatcher.test.mjs integrations/registry-worker-adapter.test.mjs integrations/worker-host.test.mjs integrations/default-worker-host.test.mjs extensions/local-model/local-model-worker.test.mjs extensions/sovereign-node-health/health-worker.test.mjs extensions/repository-inventory/inventory-worker.test.mjs extensions/shared-task-proposal/proposal-worker.test.mjs extensions/github-metadata/github-metadata-worker.test.mjs integrations/shared-task-proposal-adapter.test.mjs integrations/shared-task-inbox.test.mjs integrations/worker-host-cli.test.mjs

  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Exercise the unified entry point under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1; found $($PSVersionTable.PSVersion)." }
          $state = Join-Path $env:TEMP ("heavenzfire-unified-field-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $state | Out-Null
          $env:HEAVENZFIRE_STATE_DIR = $state
          $inboxProcess = $null
          try {
            $task = @{
              taskId = "windows-ps51-e2e"
              title = "Windows PowerShell task host fixture"
              requestedBy = "ci-operator"
              metadata = @{
                capability = "funding.reconcile.read_only"
                input = @{
                  appropriations = @()
                  awards = @()
                  disbursements = @()
                }
              }
            } | ConvertTo-Json -Depth 20 -Compress
            Write-Host "Windows PowerShell E2E: submit funding task"
            $submittedRaw = & .\Enter-UnifiedField.ps1 -TaskAction Submit -TaskJson $task
            $submitted = ($submittedRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($submitted.status -ne "queued") { throw "Submit failed: $($submittedRaw -join '')" }
            Write-Host "Windows PowerShell E2E: approve funding task"
            & .\Enter-UnifiedField.ps1 -TaskAction Approve -TaskId "windows-ps51-e2e" -Actor "ci-operator" -Reason "Approved Windows PowerShell fixture" | Out-Null
            Write-Host "Windows PowerShell E2E: dispatch funding task"
            $resultRaw = & .\Enter-UnifiedField.ps1 -TaskAction Dispatch -TaskId "windows-ps51-e2e" -ExtensionId "funding.integrity" -Actor "ci-operator" -Reason "Run read-only fixture"
            $result = ($resultRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($result.status -ne "succeeded" -or $result.result.mode -ne "read_only") { throw "Dispatch failed: $($resultRaw -join '')" }
            Write-Host "Windows PowerShell E2E: verify audit"
            $auditRaw = & .\Enter-UnifiedField.ps1 -TaskAction Audit
            $audit = ($auditRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($audit.resultRecords -ne 1 -or -not $audit.resultChainHead) { throw "Audit verification failed: $($auditRaw -join '')" }

            Write-Host "Windows PowerShell E2E: start proposal inbox"
            $entrypoint = Join-Path $PWD.Path 'Enter-UnifiedField.ps1'
            $inboxFile = Join-Path $state 'shared-task-inbox.jsonl'
            $inboxStdout = Join-Path $state 'inbox.stdout.log'
            $inboxStderr = Join-Path $state 'inbox.stderr.log'
            $powerShellPath = (Get-Command powershell.exe).Source
            $inboxProcess = Start-Process -FilePath $powerShellPath -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $entrypoint, '-TaskAction', 'StartInbox', '-InboxPort', '18797', '-InboxFilePath', $inboxFile) -WorkingDirectory $PWD.Path -PassThru -WindowStyle Hidden -RedirectStandardOutput $inboxStdout -RedirectStandardError $inboxStderr
            $healthy = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18797/api/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $healthy = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $healthy) {
              $detail = if (Test-Path -LiteralPath $inboxStderr) { Get-Content -LiteralPath $inboxStderr -Raw } else { 'no server log' }
              throw "Shared inbox did not become healthy: $detail"
            }

            $proposal = @{
              taskId = "windows-ps51-proposal"
              title = "Private source task title"
              requestedBy = "ci-operator"
              metadata = @{
                capability = "task.proposal.submit"
                endpoint = "http://127.0.0.1:18797/api/tasks"
                proposalPurpose = "Share only this short proposal summary"
                prompt = "private prompt must not be forwarded"
                input = @{ privateRecord = "must not be forwarded" }
              }
            } | ConvertTo-Json -Depth 20 -Compress
            Write-Host "Windows PowerShell E2E: submit proposal task"
            $proposalSubmitRaw = & .\Enter-UnifiedField.ps1 -TaskAction Submit -TaskJson $proposal
            $proposalSubmitted = ($proposalSubmitRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($proposalSubmitted.status -ne "queued") { throw "Proposal task submit failed: $($proposalSubmitRaw -join '')" }
            & .\Enter-UnifiedField.ps1 -TaskAction Approve -TaskId "windows-ps51-proposal" -Actor "ci-operator" -Reason "Approved loopback proposal delivery" | Out-Null
            Write-Host "Windows PowerShell E2E: dispatch proposal task"
            $proposalResultRaw = & .\Enter-UnifiedField.ps1 -TaskAction Dispatch -TaskId "windows-ps51-proposal" -ExtensionId "shared-task.proposal" -Actor "ci-operator" -Reason "Deliver approved proposal summary"
            $proposalResult = ($proposalResultRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($proposalResult.status -ne "succeeded" -or $proposalResult.result.status -ne "proposed" -or $proposalResult.result.approvalState -ne "pending") {
              throw "Shared proposal dispatch failed: $($proposalResultRaw -join '')"
            }
            $inboxBody = Invoke-RestMethod -Uri 'http://127.0.0.1:18797/api/tasks' -TimeoutSec 2
            if ($inboxBody.tasks.Count -ne 1 -or $inboxBody.tasks[0].goal -ne "Share only this short proposal summary") { throw "Inbox did not store the minimized proposal." }
            $env:HEAVENZFIRE_TASK_INBOX_URL = 'http://127.0.0.1:18797/api/tasks'
            $inboxListRaw = & .\Enter-UnifiedField.ps1 -TaskAction InboxList
            $inboxList = ($inboxListRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($inboxList.tasks.Count -ne 1 -or $inboxList.tasks[0].taskId -ne "windows-ps51-proposal") { throw "PowerShell inbox-list command failed." }
            $claimRaw = & .\Enter-UnifiedField.ps1 -TaskAction Claim -TaskId "windows-ps51-proposal" -WorkerId "worker-a" -LeaseSeconds 30
            $claim = ($claimRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($claim.workerId -ne "worker-a" -or -not $claim.expiresAt) { throw "PowerShell claim action failed." }
            $claimedListRaw = & .\Enter-UnifiedField.ps1 -TaskAction InboxList
            $claimedList = ($claimedListRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($claimedList.tasks[0].claim.workerId -ne "worker-a") { throw "Inbox list did not show the active lease." }
            $competingClaimRejected = $false
            try {
              & .\Enter-UnifiedField.ps1 -TaskAction Claim -TaskId "windows-ps51-proposal" -WorkerId "worker-b" -LeaseSeconds 30 | Out-Null
            } catch { $competingClaimRejected = $true }
            if (-not $competingClaimRejected) { throw "Inbox allowed two active worker claims." }
            $releaseRaw = & .\Enter-UnifiedField.ps1 -TaskAction Release -TaskId "windows-ps51-proposal" -WorkerId "worker-a"
            $releasedClaim = ($releaseRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if (-not $releasedClaim.released) { throw "PowerShell release action failed." }
            $releasedListRaw = & .\Enter-UnifiedField.ps1 -TaskAction InboxList
            $releasedList = ($releasedListRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($releasedList.tasks[0].claim) { throw "Released lease remains visible as active." }
            $inboxAuditRaw = & .\Enter-UnifiedField.ps1 -TaskAction InboxAudit
            $inboxAudit = ($inboxAuditRaw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($inboxAudit.proposalCount -ne 1 -or $inboxAudit.claimEventCount -ne 2 -or -not $inboxAudit.proposalChainHead -or -not $inboxAudit.claimChainHead) {
              throw "PowerShell inbox audit failed: $($inboxAuditRaw -join '')"
            }
            if ($inboxBody.tasks[0].metadata.prompt -or $inboxBody.tasks[0].metadata.input) { throw "Sensitive task payload leaked into the shared proposal." }
          } catch {
            Write-Host "Windows PowerShell E2E failed: $($_.Exception.Message)"
            if (Test-Path -LiteralPath (Join-Path $state "inbox.stderr.log")) { Write-Host (Get-Content -LiteralPath (Join-Path $state "inbox.stderr.log") -Raw) }
            throw
          } finally {
            Remove-Item Env:HEAVENZFIRE_TASK_INBOX_URL -ErrorAction SilentlyContinue
            if (-not [string]::IsNullOrWhiteSpace($inboxStdout) -and (Test-Path -LiteralPath $inboxStdout)) {
              try {
                $serverInfo = Get-Content -LiteralPath $inboxStdout -Raw | ConvertFrom-Json
                if ($serverInfo.pid) { Stop-Process -Id $serverInfo.pid -Force -ErrorAction SilentlyContinue }
              } catch {}
            }
            if ($inboxProcess -and -not $inboxProcess.HasExited) { Stop-Process -Id $inboxProcess.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath $state -Recurse -Force -ErrorAction SilentlyContinue
          }
