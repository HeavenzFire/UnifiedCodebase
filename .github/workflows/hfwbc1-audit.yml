name: HFWBC1 audit

on:
  push:
    branches: ["feat/hfwbc1-v3-1-audit"]
    paths:
      - "HFWBC1/**"
      - ".github/workflows/hfwbc1-audit.yml"
  pull_request:
    paths:
      - "HFWBC1/**"
      - ".github/workflows/hfwbc1-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: HFWBC1 structural and CRC audit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check HFWBC1/hfwbc1-v3_1-audit.cjs
      - name: Syntax check v3.2 envelope
        run: node --check HFWBC1/hfwbc1-v3_2-envelope.cjs
      - name: Run deterministic tests
        run: node --test HFWBC1/hfwbc1-v3_1-audit.test.cjs HFWBC1/hfwbc1-v3_1-actions-fuzz.test.cjs HFWBC1/hfwbc1-v3_2-envelope.test.cjs
