name: Shared task adapter verification

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "MicroFederation/shared-task-adapter.cjs"
      - "MicroFederation/shared-task-adapter.test.cjs"
      - "MicroFederation/task-ledger.cjs"
      - "MicroFederation/test-task-ledger.cjs"
      - ".github/workflows/shared-task-adapter.yml"
  pull_request:
    paths:
      - "MicroFederation/shared-task-adapter.cjs"
      - "MicroFederation/shared-task-adapter.test.cjs"
      - ".github/workflows/shared-task-adapter.yml"

permissions:
  contents: read

jobs:
  adapter-contract:
    name: Adapter contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check MicroFederation/shared-task-adapter.cjs
      - name: Run deterministic contract tests
        run: node --test MicroFederation/test-task-ledger.cjs MicroFederation/shared-task-adapter.test.cjs
