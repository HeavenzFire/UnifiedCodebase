name: HeavenzFire native tool runtime

on:
  pull_request:
    paths:
      - "Tools/**"
      - ".github/workflows/native-tool-runtime.yml"
  push:
    branches: ["main"]
    paths:
      - "Tools/**"
      - ".github/workflows/native-tool-runtime.yml"

permissions:
  contents: read

jobs:
  native-tool-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node-version }}
      - name: Syntax check
        run: node --check Tools/native-tool-runtime.cjs
      - name: Contract and security-boundary tests
        run: node --test Tools/native-tool-runtime.test.cjs
