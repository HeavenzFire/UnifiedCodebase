name: HeavenzFire native tool runtime

on:
  pull_request:
    paths:
      - "Tools/**"
      - ".github/workflows/native-tool-runtime.yml"
  push:
    branches: ["main"]
    paths:
      - "Tools/**"
      - ".github/workflows/native-tool-runtime.yml"

permissions:
  contents: read

jobs:
  native-tool-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Node.js
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 18) process.exit(1)"
      - name: Syntax check
        run: node --check Tools/native-tool-runtime.cjs
      - name: Contract and security-boundary tests
        run: node --test Tools/native-tool-runtime.test.cjs
