name: Local Inference Engine

on:
  push:
    branches:
      - feat/local-gpt-inference-engine-v0.1
  pull_request:
    paths:
      - 'MicroFederation/local-inference-engine.cjs'
      - 'MicroFederation/test-local-inference-engine.cjs'
      - 'MicroFederation/Start-LocalInferenceEngine.ps1'
      - 'MicroFederation/LOCAL-GPT-INFERENCE-ENGINE.md'
      - '.github/workflows/local-inference-engine.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check MicroFederation/local-inference-engine.cjs
      - name: Contract tests
        run: node --test MicroFederation/test-local-inference-engine.cjs
