name: MicroFederation durable services verification

on:
  pull_request:
    paths:
      - "MicroFederation/provider-registry.cjs"
      - "MicroFederation/test-provider-registry.cjs"
      - "MicroFederation/verify-provider-registry.ps1"
      - "MicroFederation/task-ledger.cjs"
      - "MicroFederation/test-task-ledger.cjs"
      - "MicroFederation/ledger-orchestrator-worker.cjs"
      - "MicroFederation/test-ledger-orchestrator-worker.cjs"
      - "MicroFederation/capability-store.cjs"
      - "MicroFederation/test-capability-store.cjs"
      - "MicroFederation/project-node-registry.cjs"
      - "MicroFederation/test-project-node-registry.cjs"
      - "MicroFederation/agent-command-center.cjs"
      - "MicroFederation/test-agent-command-center.cjs"
      - "MicroFederation/live-orchestrator-adapter.cjs"
      - ".github/workflows/provider-registry.yml"
  push:
    branches: ["main"]
    paths:
      - "MicroFederation/provider-registry.cjs"
      - "MicroFederation/test-provider-registry.cjs"
      - "MicroFederation/verify-provider-registry.ps1"
      - "MicroFederation/task-ledger.cjs"
      - "MicroFederation/test-task-ledger.cjs"
      - "MicroFederation/ledger-orchestrator-worker.cjs"
      - "MicroFederation/test-ledger-orchestrator-worker.cjs"
      - "MicroFederation/capability-store.cjs"
      - "MicroFederation/test-capability-store.cjs"
      - "MicroFederation/project-node-registry.cjs"
      - "MicroFederation/test-project-node-registry.cjs"
      - "MicroFederation/agent-command-center.cjs"
      - "MicroFederation/test-agent-command-center.cjs"
      - "MicroFederation/live-orchestrator-adapter.cjs"
      - ".github/workflows/provider-registry.yml"

permissions:
  contents: read

jobs:
  durable-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check syntax
        run: |
          node --check MicroFederation/provider-registry.cjs
          node --check MicroFederation/task-ledger.cjs
          node --check MicroFederation/ledger-orchestrator-worker.cjs
          node --check MicroFederation/capability-store.cjs
      - name: Run provider registry tests
        run: node --test MicroFederation/test-provider-registry.cjs
      - name: Run durable task ledger tests
        run: node --test MicroFederation/test-task-ledger.cjs
      - name: Run ledger-backed orchestrator worker tests
        run: node --test MicroFederation/test-ledger-orchestrator-worker.cjs
      - name: Run persistent capability store tests
        run: node --test MicroFederation/test-capability-store.cjs
      - name: Check project and node registry syntax
        run: node --check MicroFederation/project-node-registry.cjs
      - name: Run project and node registry tests
        run: node --test MicroFederation/test-project-node-registry.cjs
      - name: Check Agent Command Center syntax
        run: node --check MicroFederation/agent-command-center.cjs
      - name: Run Agent Command Center tests
        run: node --test MicroFederation/test-agent-command-center.cjs
