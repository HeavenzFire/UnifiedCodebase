name: Federation protocol core

on:
  push:
    branches:
      - research/cross-device-federation-rd-v0.1
    paths:
      - 'MicroFederation/**'
      - 'scripts/rd/**'
      - '.github/workflows/federation-protocol.yml'
  pull_request:
    paths:
      - 'MicroFederation/**'
      - 'scripts/rd/federation-node-config.example.cjs'
      - '.github/workflows/federation-protocol.yml'

permissions:
  contents: read

concurrency:
  group: federation-protocol-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check federation modules and launch scripts
        run: |
          for file in MicroFederation/*.cjs scripts/rd/*.cjs; do node --check "$file"; done
          bash -n scripts/rd/start-federation-android.sh
      - name: Federation protocol tests
        run: node --test MicroFederation/test/federation-protocol.test.cjs
      - name: Canonical shared-task adapter tests
        run: node --test MicroFederation/test/shared-task-ledger-adapter.test.cjs
      - name: Isolated federation transport tests (20s per case)
        shell: bash
        run: |
          set +e
          failures=0
          patterns=(
            'HTTP binding listens on loopback'
            'authenticated handshake permits'
            'task submission requires a handshake'
            'server rejects unsigned'
            'task submission still passes'
            'authenticated task.read'
            'task retrieval is denied'
            'client refuses non-loopback'
            'client disables redirects'
            'client rejects localhost aliases'
          )
          for pattern in "${patterns[@]}"; do
            echo "::group::transport test: $pattern"
            timeout 20s node --test --test-name-pattern="$pattern" MicroFederation/test/federation-http-transport.test.cjs
            result=$?
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then
              echo "FAILED_OR_TIMED_OUT: $pattern (exit $result)"
              failures=$((failures + 1))
            fi
          done
          echo "Transport isolated failures/timeouts: $failures"
          test "$failures" -eq 0
      - name: Federation HTTP and task-scope tests
        run: node --test MicroFederation/test/federation-http.test.cjs
      - name: Governed worker, queue isolation, and stop-race tests
        run: node --test MicroFederation/test-governed-runtime.cjs
      - name: Operator approval proof tests
        run: node --test MicroFederation/test/operator-approval.test.cjs
      - name: Local inference privacy tests
        run: node --test MicroFederation/test/openai-local-inference-adapter.test.cjs
