name: Federation protocol core

on:
  push:
    branches:
      - research/cross-device-federation-rd-v0.1
    paths:
      - 'MicroFederation/**'
      - 'scripts/rd/**'
      - '.github/workflows/federation-protocol.yml'
  pull_request:
    paths:
      - 'MicroFederation/**'
      - 'scripts/rd/federation-node-config.example.cjs'
      - '.github/workflows/federation-protocol.yml'

permissions:
  contents: read

concurrency:
  group: federation-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run deterministic federation suites
        run: node --test MicroFederation/test/federation-protocol.test.cjs MicroFederation/test/shared-task-ledger-adapter.test.cjs MicroFederation/test/federation-http-transport.test.cjs MicroFederation/test/federation-http.test.cjs MicroFederation/test/openai-local-inference-adapter.test.cjs
