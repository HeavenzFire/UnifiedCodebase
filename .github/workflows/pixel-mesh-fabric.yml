name: Unified Field pixel mesh and nonlinear fabric
on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "MicroFederation/**"
      - ".github/workflows/pixel-mesh-fabric.yml"
  pull_request:
    paths:
      - "MicroFederation/**"
      - ".github/workflows/pixel-mesh-fabric.yml"
permissions:
  contents: read
jobs:
  mesh-fabric:
    name: Human-protection fabric (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax checks
        run: |
          node --check MicroFederation/approval-gate.cjs
          node --check MicroFederation/approval-nonce-store.cjs
          node --check MicroFederation/task-ledger.cjs
          node --check MicroFederation/pixel-mesh.cjs
          node --check MicroFederation/nonlinear-workflow.cjs
          node --check MicroFederation/unified-field-fabric.cjs
          node --check MicroFederation/shared-task-adapter.cjs
      - name: Run human-protection and regression tests
        run: |
          node --test MicroFederation/test-pixel-mesh.cjs MicroFederation/test-nonlinear-workflow.cjs MicroFederation/test-unified-field-fabric.cjs MicroFederation/test-task-ledger.cjs MicroFederation/test-human-protection.cjs MicroFederation/test-approval-gate.cjs MicroFederation/test-shared-task-adapter-fabric-isolation.cjs MicroFederation/test-approval-nonce-store.cjs
