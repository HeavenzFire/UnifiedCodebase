name: Unified Field Core
on:
  push:
    paths:
      - 'unified-field/**'
      - 'extensions/**'
      - 'docs/**'
      - 'README.md'
      - 'integrations/**'
      - 'Enter-UnifiedField.ps1'
      - '.github/workflows/unified-field-ci.yml'
  pull_request:
    paths:
      - 'unified-field/**'
      - 'extensions/**'
      - 'integrations/**'
      - 'Enter-UnifiedField.ps1'
      - '.github/workflows/unified-field-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check manifest validation and runtime modules
        run: node --check integrations/validate-repository-inventory.mjs && node --check integrations/validate-extension-manifests.mjs && node --check integrations/extension-runtime.mjs && node --check integrations/task-lifecycle.mjs && node --check integrations/durable-task-lifecycle.mjs && node --check integrations/governed-task-lifecycle.mjs && node --check integrations/shared-task-proposal-adapter.mjs
      - name: Run provider, extension registry, and integration contract tests
        run: node --test integrations/validate-repository-inventory.test.mjs unified-field/provider-router.test.mjs extensions/funding-integrity/reconcile.test.mjs extensions/funding-integrity/examples/sample-funding.test.mjs extensions/guardian-evidence/evidence-ledger.test.mjs integrations/sovereign-node-adapter.test.mjs integrations/extension-registry.test.mjs integrations/load-extension-manifests.test.mjs integrations/extension-runtime.test.mjs integrations/task-lifecycle.test.mjs integrations/durable-task-lifecycle.test.mjs integrations/governed-task-lifecycle.test.mjs integrations/shared-task-proposal-adapter.test.mjs
